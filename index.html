<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Cinema Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }
        .search-container {
            display: flex;
            width: 100%;
            max-width: 500px;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #6c5ce7;
        }
        button {
            padding: 0 24px;
            border-radius: 12px;
            border: none;
            background-color: #6c5ce7;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background-color: #5b4bc4;
        }
        .info-box {
            text-align: center;
            color: #a29bfe;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h2>🎬 Введите ID фильма</h2>
    <div class="search-container">
        <input type="number" id="filmIdInput" placeholder="Например: 111">
        <button onclick="prepareFilm()">Найти</button>
    </div>

    <div id="infoBox" class="info-box">
        Введите ID фильма и нажмите «Найти», чтобы активировать плеер.
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let targetUrl = '';

        function prepareFilm() {
            const filmId = document.getElementById('filmIdInput').value;
            const infoBox = document.getElementById('infoBox');

            if (!filmId) {
                alert('Пожалуйста, введите ID фильма!');
                return;
            }

            targetUrl = `https://g0r-09flg80.troutcdn.site/${filmId}`;

            infoBox.innerHTML = "✅ Фильм найден! Нажмите на кнопку <b>«Смотреть»</b> внизу экрана.";

            // Показываем официальную системную кнопку Telegram внизу интерфейса
            tg.MainButton.text = "▶ СМОТРЕТЬ ПЛЕЕР";
            tg.MainButton.color = "#6c5ce7";
            tg.MainButton.textColor = "#ffffff";
            tg.MainButton.show();
        }

        // При нажатии на системную кнопку Telegram открывает плеер во встроенном окне
        Telegram.WebApp.onEvent('mainButtonClicked', function(){
            if (targetUrl) {
                // Открываем во встроенном окне просмотрщика Telegram
                tg.openLink(targetUrl);
            }
        });
    </script>
</body>
</html>

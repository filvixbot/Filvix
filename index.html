<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Cinema Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            margin-bottom: 15px;
            font-size: 22px;
            text-align: center;
        }
        .search-container {
            display: flex;
            width: 100%;
            max-width: 400px;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #6c5ce7;
        }
        button {
            padding: 0 24px;
            border-radius: 12px;
            border: none;
            background-color: #6c5ce7;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background-color: #5b4bc4;
        }
        .watch-btn {
            display: none;
            background-color: #00b894;
            color: white;
            padding: 16px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>🎬 Введите ID фильма</h2>
    <div class="search-container">
        <input type="number" id="filmIdInput" placeholder="Например: 111">
        <button onclick="generateLink()">Найти</button>
    </div>

    <a id="watchBtn" href="#" target="_blank" class="watch-btn">▶ СМОТРЕТЬ ФИЛЬМ</a>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function generateLink() {
            const filmId = document.getElementById('filmIdInput').value;
            const watchBtn = document.getElementById('watchBtn');

            if (!filmId) {
                alert('Пожалуйста, введите ID фильма!');
                return;
            }

            const targetUrl = `https://g0r-09flg80.troutcdn.site/${filmId}`;
            
            watchBtn.href = targetUrl;
            watchBtn.style.display = 'block';
        }
    </script>
</body>
</html>

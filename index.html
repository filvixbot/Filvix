<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Cinema Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 20px;
        }
        .search-container {
            display: flex;
            width: 100%;
            max-width: 500px;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #2a2a35;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #6c5ce7;
        }
        button {
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background-color: #6c5ce7;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background-color: #5b4bc4;
        }
        .player-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            background-color: #1a1a24;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .placeholder {
            color: #666;
            text-align: center;
        }
        .watch-btn {
            background-color: #6c5ce7;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
            transition: background 0.2s;
        }
        .watch-btn:hover {
            background-color: #5b4bc4;
        }
    </style>
</head>
<body>

    <h2>🎬 Введите ID фильма</h2>
    <div class="search-container">
        <input type="number" id="filmIdInput" placeholder="Например: 111">
        <button onclick="loadFilm()">Найти</button>
    </div>

    <div class="player-container">
        <div id="placeholder" class="placeholder">Введите ID и нажмите «Найти»</div>
        <div id="resultContainer" style="display: none; text-align: center;">
            <p style="margin-bottom: 20px; font-size: 16px; color: #a29bfe;">Фильм готов к просмотру!</p>
            <!-- Заменили ссылку на обычную кнопку с обработчиком -->
            <button id="watchBtn" class="watch-btn">▶ Открыть плеер</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentUrl = '';

        function loadFilm() {
            const filmId = document.getElementById('filmIdInput').value;
            const resultContainer = document.getElementById('resultContainer');
            const placeholder = document.getElementById('placeholder');

            if (!filmId) {
                alert('Пожалуйста, введите ID фильма!');
                return;
            }

            currentUrl = `https://g0r-09flg80.troutcdn.site/${filmId}`;

            placeholder.style.display = 'none';
            resultContainer.style.display = 'block';
        }

        // При клике на кнопку открываем плеер внутри Telegram WebApp
        document.getElementById('watchBtn').addEventListener('click', function() {
            if (currentUrl) {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                    // Открывает ссылку во встроенном окне браузера Telegram, не закрывая Mini App
                    window.Telegram.WebApp.openLink(currentUrl);
                } else {
                    window.open(currentUrl, '_blank');
                }
            }
        });
    </script>
</body>
</html>

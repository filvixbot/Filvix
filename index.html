<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Cinema Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 20px;
        }
        .search-container {
            display: flex;
            width: 100%;
            max-width: 500px;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #2a2a35;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #6c5ce7;
        }
        button {
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background-color: #6c5ce7;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background-color: #5b4bc4;
        }
        .player-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            background-color: #1a1a24;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }
        .placeholder {
            color: #666;
            text-align: center;
            padding: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>🎬 Введите ID фильма</h2>
    <div class="search-container">
        <input type="number" id="filmIdInput" placeholder="Например: 111">
        <button onclick="loadFilm()">Смотреть</button>
    </div>

    <div class="player-container">
        <div id="placeholder" class="placeholder">Введите ID и нажмите «Смотреть»</div>
        <!-- Используем sandbox для предотвращения вылета из приложения в браузер -->
        <iframe id="playerFrame" style="display: none;" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"></iframe>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function loadFilm() {
            const filmId = document.getElementById('filmIdInput').value;
            const placeholder = document.getElementById('placeholder');
            const playerFrame = document.getElementById('playerFrame');

            if (!filmId) {
                alert('Пожалуйста, введите ID фильма!');
                return;
            }

            const targetUrl = `https://g0r-09flg80.troutcdn.site/${filmId}`;

            placeholder.style.display = 'none';
            playerFrame.style.display = 'block';
            playerFrame.src = targetUrl;
        }
    </script>
</body>
</html>
